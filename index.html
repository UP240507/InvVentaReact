<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>InvVenta POS & ERP</title>

    <!-- Dos cambios con motivo, 13-ago:

      `interactive-widget=resizes-content` — sin esto, al abrir el teclado del
      teléfono el viewport de layout NO encoge, así que un modal con
      `max-h-90dvh` sigue midiendo la pantalla entera y su pie —el botón de
      guardar— queda DEBAJO del teclado. Es el fallo que `MOCKUPS_RESPONSIVE.md`
      nombra como clásico, y se arregla aquí una vez para las 37 rutas.

      Se quitaron `maximum-scale=1.0, user-scalable=no` — impedían hacer zoom.
      Además de fallar WCAG 1.4.4, en un restaurante es justo lo que necesita
      alguien de sesenta años para leer un ticket en un teléfono. iOS los ignora
      desde hace años; Android no, así que sí tenían efecto. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="InvVenta" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Aquí había un enlace a Google Fonts con Inter y Syne. Se fue el 18-ago:
      Inter no se usa en ninguna parte del CSS ni del código, y Syne pasó a
      servirse desde el propio bundle (`src/main.jsx`). Una caja sin internet no
      puede descargar una hoja de estilos de un CDN, y ese `<link>` está en el
      camino crítico del arranque: el navegador no pinta hasta resolverlo o
      rendirse. Un POS offline-first no puede empezar pidiéndole permiso a la
      red. -->

    <style>
      /* Optimizaciones base sin romper el scroll ni los inputs */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden; /* Solo bloqueamos el scroll horizontal */
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 dark:bg-ui-obsidiana antialiased selection:bg-brand-amatista/30"
  >
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
