[package]
name = "invventa"
version = "0.1.0"
description = "InvVenta — ERP/POS gastronómico offline-first"
authors = ["Christo"]
edition = "2021"

# Ver https://tauri.app/develop/ para la guía de desarrollo.

[lib]
name = "invventa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
